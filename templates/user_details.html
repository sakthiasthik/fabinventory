<!DOCTYPE html>
<html>

<head>

    <title>User Details</title>

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial;
            background:linear-gradient(to right,#000,#3a3a3a);
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            background:white;
            padding:40px;
            border-radius:10px;
            width:320px;
            text-align:center;
        }

        input{
            width:90%;
            padding:10px;
            margin:10px 0;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:10px;
            background:black;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

    </style>

</head>

<body>

<div class="container">

    <h2>Enter Details</h2>

    <form action="/user-details" method="POST">

        <input 
            type="text" 
            name="company" 
            placeholder="Company Name"
            required
        >

        <input 
            type="text" 
            name="person" 
            placeholder="Person Name"
            required
        >

        <button type="submit">
            Continue
        </button>

    </form>

</div>

</body>

</html>
