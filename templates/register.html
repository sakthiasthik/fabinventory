<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <style>

        body{
            font-family: Arial;
            background:#111;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .box{
            background:white;
            padding:40px;
            border-radius:10px;
            width:300px;
        }

        input{
            width:100%;
            padding:10px;
            margin:10px 0;
        }

        button{
            width:100%;
            padding:10px;
            background:black;
            color:white;
            border:none;
        }

    </style>
</head>

<body>

<div class="box">

<h2>Register</h2>

<form method="POST">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

<input type="text" name="username" placeholder="Username" required>

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Register</button>

</form>

</div>

</body>
</html>
