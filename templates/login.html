<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabInventory — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h2 { margin-bottom: 4px; }
        .login-card .subtitle { color: #6c757d; margin-bottom: 20px; }
        .divider {
            display: flex; align-items: center; margin: 18px 0; color: #999;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid #ddd;
        }
        .divider span { padding: 0 12px; font-size: 13px; }
        .github-btn {
            background: #24292e; color: white; border: none;
            padding: 10px; border-radius: 6px; width: 100%;
            font-size: 15px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .github-btn:hover { background: #1b1f23; color: white; }
    </style>
</head>
<body>
<div class="login-card">
    <h2><i class="bi bi-box-seam"></i> FabInventory</h2>
    <p class="subtitle">Sign in to continue</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show py-2">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- GitHub OAuth (if configured) -->
    <a href="{{ url_for('main.login_github') }}" class="github-btn">
        <i class="bi bi-github" style="font-size: 20px;"></i> Login with GitHub
    </a>

    <div class="divider"><span>or use password</span></div>

    <!-- Password Login -->
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="password" class="form-label">Admin Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-dark w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
