<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabInventory — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background:
                radial-gradient(800px 420px at 85% 0%, rgba(99, 102, 241, .25), transparent 60%),
                radial-gradient(700px 400px at 10% 100%, rgba(14, 165, 233, .12), transparent 60%),
                #0b1220;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
        }
        .login-card {
            background: white;
            border-radius: 18px;
            padding: 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .65);
            border: 1px solid rgba(255, 255, 255, .08);
        }
        .login-brand {
            display: flex; align-items: center; gap: 10px;
            font-size: 1.35rem; font-weight: 700;
            letter-spacing: -.02em; margin-bottom: 2px;
        }
        .brand-mark {
            display: inline-grid; place-items: center;
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            color: white; font-size: 1.1rem;
            box-shadow: 0 8px 18px -6px rgba(79, 70, 229, .7);
        }
        .login-card .subtitle { color: #667085; margin: 0 0 22px; }
        .divider {
            display: flex; align-items: center; margin: 18px 0; color: #98a2b3;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; border-bottom: 1px solid #e4e7ec;
        }
        .divider span {
            padding: 0 12px; font-size: 12px;
            text-transform: uppercase; letter-spacing: .06em;
        }
        .github-btn {
            background: #0b1220; color: white; border: none;
            padding: 11px; border-radius: 10px; width: 100%;
            font-size: 15px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            text-decoration: none;
        }
        .github-btn:hover { background: #1f2937; color: white; }
        .login-card .form-control {
            border-radius: 10px; padding: .6rem .8rem;
        }
        .login-card .form-control:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, .13);
        }
        .login-card .btn-primary {
            background: #4f46e5; border-color: #4f46e5;
            border-radius: 10px; padding: .6rem; font-weight: 600;
        }
        .login-card .btn-primary:hover {
            background: #4338ca; border-color: #4338ca;
        }
        .privacy-note {
            color: #98a2b3; font-size: 12px;
            text-align: center; margin: 18px 0 0;
        }
    </style>
</head>
<body>
<div class="login-card">
    <div class="login-brand">
        <span class="brand-mark"><i class="bi bi-box-seam"></i></span>
        FabInventory
    </div>
    <p class="subtitle">Sign in to your local workspace</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show py-2">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <!-- GitHub OAuth (if configured) -->
    <a href="{{ url_for('main.login_github') }}" class="github-btn">
        <i class="bi bi-github" style="font-size: 20px;"></i> Login with GitHub
    </a>

    <div class="divider"><span>or use password</span></div>

    <!-- Password Login -->
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label for="password" class="form-label">Admin Password</label>
            <input type="password" class="form-control" id="password" name="password"
                   placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">
            <i class="bi bi-box-arrow-in-right"></i> Sign In
        </button>
    </form>

    <p class="privacy-note">Local-first inventory for hardware teams.</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
